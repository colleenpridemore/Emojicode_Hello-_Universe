<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<body>
    <h1>Convert JSON to PDF</h1>
    <button id="generate-pdf">Generate PDF</button>

    <script>
        const jsonUrl = "https://raw.githubusercontent.com/colleenpridemore/Emojicode_Hello-_Universe/main/pi-user-history.json";

        document.getElementById('generate-pdf').addEventListener('click', () => {
            fetch(jsonUrl)
                .then(response => response.json())
                .then(data => {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    // Title of the PDF
                    doc.setFontSize(16);
                    doc.text("Feelings Knowledge Base - AI", 10, 10);

                    // Add JSON data to the PDF
                    let y = 20;
                    data.user_data.messages.forEach((message, index) => {
                        doc.setFontSize(12);
                        doc.text(`Message #${index + 1}:`, 10, y);
                        y += 10;
                        doc.setFontSize(10);
                        doc.text(`Text: ${message.text}`, 10, y);
                        y += 10;
                        doc.text(`Sender: ${message.sender}`, 10, y);
                        y += 10;
                        doc.text(`Channel: ${message.channel}`, 10, y);
                        y += 10;
                        doc.text(`Sent At: ${message.sent_at}`, 10, y);
                        y += 20;

                        if (y > 270) { // Add a new page if content exceeds page height
                            doc.addPage();
                            y = 10;
                        }
                    });

                    // Save the PDF
                    doc.save("feelings-knowledge-base.pdf");
                })
                .catch(error => console.error('Error fetching JSON:', error));
        });
    </script>
</body>
</html>
